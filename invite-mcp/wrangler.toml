# Muse Teams Invite Channel MCP
# Deploy: CLOUDFLARE_EMAIL + CLOUDFLARE_API_KEY (forwarding Global Key) — see vault service:cloudflare
name = "muse-teams-invite"
main = "worker.js"
compatibility_date = "2026-10-13"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[vars]
FLEET_API_URL = "https://fleet.vyibc.com/api/fleet"
TEAMS_API_URL = "https://muse-teams-v1.2513120790.workers.dev"
TEAMS_MCP_URL = "https://teams.vyibc.com/mcp"

[[kv_namespaces]]
binding = "DELIVERY_LOG"
id = "d7fb896d2fe74f2c9a91046bb0581061"

# Secrets (wrangler secret put):
#   IMGGEN_TOKEN  — same as fleet-console / imggen:fleet-shared (Bearer for imggen-*/generate engine=muse)
# Optional:
#   FLEET_API_TOKEN — if /api/fleet ever requires auth
#   MUSE_INJECT_URL — optional adapter override (legacy stub schema)
