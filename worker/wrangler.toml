# Muse Teams 后端 Worker 部署配置
# 标准 wrangler 流程：wrangler login && wrangler deploy
name = "muse-teams-v1"
main = "teams.js"
compatibility_date = "2026-10-13"

[[durable_objects.bindings]]
name = "TASK_QUEUE"
class_name = "TaskQueue"

[[migrations]]
tag = "v8"
new_sqlite_classes = ["TaskQueue"]

# D1 index for company/agent/task listing (DO remains source of truth for claim races)
[[d1_databases]]
binding = "DB"
database_name = "muse-teams"
database_id = "708d3bef-c626-4ad2-aee6-12c30c01dd22"
